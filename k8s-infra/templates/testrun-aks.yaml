apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: __TEST_RUN_NAME__
  namespace: featbit-loadtest
  labels:
    app.kubernetes.io/name: featbit-k6
    app.kubernetes.io/part-of: featbit-load-testing
    loadtest.featbit.io/run-id: __RUN_ID__
    loadtest.featbit.io/profile: __PROFILE__
spec:
  parallelism: __PARALLELISM__
  separate: true
  script:
    localFile: /tests/k6/server-streaming.js
  arguments: >-
    --tag run_id=__RUN_ID__
    --tag profile=__PROFILE__
  starter:
    nodeSelector:
      workload: loadgen
    tolerations:
      - key: workload
        operator: Equal
        value: loadgen
        effect: NoSchedule
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  runner:
    image: __RUNNER_IMAGE__
    imagePullPolicy: IfNotPresent
    nodeSelector:
      workload: loadgen
    tolerations:
      - key: workload
        operator: Equal
        value: loadgen
        effect: NoSchedule
    metadata:
      labels:
        app.kubernetes.io/name: featbit-k6-runner
        loadtest.featbit.io/run-id: __RUN_ID__
        loadtest.featbit.io/profile: __PROFILE__
    resources:
      requests:
        cpu: "__RUNNER_CPU_REQUEST__"
        memory: __RUNNER_MEMORY_REQUEST__
      limits:
        memory: __RUNNER_MEMORY_LIMIT__
    securityContext:
      runAsNonRoot: true
      runAsUser: 12345
      runAsGroup: 12345
      fsGroup: 12345
      fsGroupChangePolicy: OnRootMismatch
    envFrom:
      - configMapRef:
          name: featbit-k6-target
      - secretRef:
          name: featbit-k6-secret
      - configMapRef:
          name: featbit-k6-controller
      - secretRef:
          name: featbit-k6-controller-secret
    env:
      - name: POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: RUN_ID
        value: __RUN_ID__
      - name: LOADTEST_PARALLELISM
        value: "__PARALLELISM__"
      - name: DISTRIBUTED_SETUP_BARRIER_SECONDS
        value: "60"
      - name: DISTRIBUTED_TEARDOWN_GRACE_SECONDS
        value: "30"
      - name: PROBE_FLAG_KEYS
        value: __PROBE_FLAG_KEYS__
      - name: MAX_CONNECTIONS
        value: "__MAX_CONNECTIONS__"
      - name: CONNECTIONS_PER_SECOND
        value: "__CONNECTIONS_PER_SECOND__"
      - name: STABILIZATION_SECONDS
        value: "__STABILIZATION_SECONDS__"
      - name: INITIAL_SYNC_TIMEOUT_SECONDS
        value: "__INITIAL_SYNC_TIMEOUT_SECONDS__"
      - name: HOLD_DURATION_SECONDS
        value: "__HOLD_DURATION_SECONDS__"
      - name: DRAIN_DURATION_SECONDS
        value: "__DRAIN_DURATION_SECONDS__"
      - name: K6_SUMMARY_EXPORT
        value: /results/$(POD_NAME)-summary.json
      - name: K6_WEB_DASHBOARD
        value: "true"
      - name: K6_WEB_DASHBOARD_HOST
        value: "0.0.0.0"
      - name: K6_WEB_DASHBOARD_PORT
        value: "5665"
      - name: K6_WEB_DASHBOARD_EXPORT
        value: /results/$(POD_NAME)-report.html
    volumeMounts:
      - name: results
        mountPath: /results
    volumes:
      - name: results
        persistentVolumeClaim:
          claimName: featbit-k6-results
