apiVersion: v1
kind: Namespace
metadata:
  name: featbit-loadtest
  labels:
    app.kubernetes.io/part-of: featbit-load-testing
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: featbit-k6-results
  namespace: featbit-loadtest
  labels:
    app.kubernetes.io/part-of: featbit-load-testing
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: results-reader
  namespace: featbit-loadtest
  labels:
    app.kubernetes.io/name: featbit-k6-results-reader
    app.kubernetes.io/part-of: featbit-load-testing
spec:
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 12345
    runAsGroup: 12345
    fsGroup: 12345
    fsGroupChangePolicy: OnRootMismatch
  containers:
    - name: reader
      image: alpine:3.21
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - "trap 'exit 0' TERM INT; while true; do sleep 3600; done"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: results
          mountPath: /results
  volumes:
    - name: results
      persistentVolumeClaim:
        claimName: featbit-k6-results
